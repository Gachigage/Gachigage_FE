name: Gachigage Frontend Deploy

on:
    push:
        branches: ["main"]
    workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Login to GHCR
              uses: docker/login-action@v3
              with:
                registry: ghcr.io
                username: ${{github.actor}}
                password: ${{secrets.GHCR_PAT}}
            
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            # 2) 이미지 빌드 & 푸시
            - name: Build and Push
              uses: docker/build-push-action@v6
              with:
                context: .
                file: ./Dockerfile
                push: true
                tags: |
                  ghcr.io/gachigage/gachigage-frontend:prod
                  ghcr.io/gachigage/gachigage-frontend:${{ github.sha }}
                build-args: |
                  NEXT_PUBLIC_API_BASE_URL=${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
                  NEXT_PUBLIC_NAVER_MAP_CLIENT_ID=${{ secrets.NEXT_PUBLIC_NAVER_MAP_CLIENT_ID }}
                cache-from: type=gha
                cache-to: type=gha,mode=max

            - name: Deploy on Server (pull & up)
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.SERVER_HOST }}
                  username: ${{ secrets.SERVER_USER }}
                  password: ${{ secrets.SERVER_PASSWORD }}
                  port: 22
                  script: |
                      cd /opt/gachigage

                      docker compose pull frontend
                      docker compose up -d --no-deps frontend
                      docker image prune -f
